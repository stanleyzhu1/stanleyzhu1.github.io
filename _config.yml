title: Stanley Zhu
email: stanleyz@uchicago.edu
description: >-
  Personal site of Stanley Zhu.
baseurl: ""
url: "https://stanleyzhu1.github.io"

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default

markdown: kramdown
highlighter: rouge
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

include:
  - _pages

author:
  name: "Stanley Zhu"
  avatar: "/assets/images/kawarau.jpg"
  bio: "Software Engineer at Google. UChicago '23."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:stanleyz@uchicago.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/stanleyzhu1"
    - label: "Resume"
      icon: "fas fa-fw fa-file-pdf"
      url: "/assets/resume.pdf"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/stanleyzhu1"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
